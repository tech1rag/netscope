[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netscope"
version = "1.0.0"
description = "Passive network traffic viewer: live packets, DNS details, ports, TCP flags and IP locations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["scapy>=2.5.0", "rich>=13.0.0", "dnspython>=2.4.0"]

[project.scripts]
netscope = "netscope.cli:main"

[tool.setuptools]
packages = ["netscope"]
